<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Materials</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">E-Learning Platform</div>

        <nav>
            <a href="instructor-dashboard.html">Dashboard</a>
            <a href="create-course.html">Create Course</a>
            <a href="materials.html">Materials</a>
            <a href="instructor-assignments.html">Assignments</a>
            <a href="instructor-quiz.html">Quiz</a>
            <a href="students.html">Students</a>
            <a href="login.html">Logout</a>
        </nav>

    </header>


    <div class="dashboard">

        <h1>Course Materials</h1>

        <p class="dashboard-text">
            Add learning materials to your courses.
        </p>


        <div class="form-card">

            <form id="materialForm">

                <label>Course ID</label>

                <input type="number" id="course_id" placeholder="Enter course ID" required>


                <label>Material Title</label>

                <input type="text" id="title" placeholder="Enter material title" required>


                <label>Material Content</label>

                <textarea id="content" rows="6" placeholder="Enter material content" required></textarea>


                <button type="submit">
                    Add Material
                </button>

            </form>


            <p id="material-message"></p>

        </div>

    </div>


    <script>

        const user = JSON.parse(localStorage.getItem("user"));


        // Check login
        if (!user) {

            alert("Please login first.");

            window.location.href = "login.html";

        }


        // Check instructor
        if (user.role !== "INSTRUCTOR") {

            alert("Only instructors can add materials.");

            window.location.href = "student-dashboard.html";

        }


        // Submit material
        document.getElementById("materialForm").addEventListener("submit", function (event) {

            event.preventDefault();


            const courseId =
                document.getElementById("course_id").value;

            const title =
                document.getElementById("title").value;

            const content =
                document.getElementById("content").value;


            fetch("http://localhost:3000/add-material", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    course_id: courseId,

                    title: title,

                    content: content

                })

            })

                .then(response => response.json())

                .then(data => {

                    const message =
                        document.getElementById("material-message");


                    if (data.success) {

                        message.innerText =
                            "Course material added successfully!";

                        document.getElementById("materialForm").reset();

                    } else {

                        message.innerText =
                            data.message;

                    }

                })

                .catch(error => {

                    console.log(error);

                    document.getElementById("material-message").innerText =
                        "Unable to add material.";

                });

        });

    </script>
    <script src="logout.js"></script>
</body>

</html>
