<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Course</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">E-Learning Platform</div>

        <nav>
            <a href="instructor-dashboard.html">Dashboard</a>
            <a href="create-course.html">Create Course</a>
            <a href="materials.html">Materials</a>
            <a href="instructor-assignments.html">Assignments</a>
            <a href="instructor-quiz.html">Quiz</a>
            <a href="students.html">Students</a>
            <a href="login.html">Logout</a>
        </nav>

    </header>


    <div class="dashboard">

        <h1>Create New Course</h1>

        <p class="dashboard-text">
            Add a new course for students.
        </p>


        <div class="form-card">

            <form id="courseForm">

                <label>Course Name</label>

                <input type="text" id="course_name" placeholder="Enter course name" required>


                <label>Description</label>

                <textarea id="description" rows="5" placeholder="Enter course description" required></textarea>


                <button type="submit">
                    Create Course
                </button>

            </form>


            <p id="course-message"></p>

        </div>

    </div>


    <script>

        // Get logged-in instructor
        const user = JSON.parse(localStorage.getItem("user"));


        // Check login
        if (!user) {

            alert("Please login first.");

            window.location.href = "login.html";

        }


        // Check instructor role
        if (user.role !== "INSTRUCTOR") {

            alert("Only instructors can create courses.");

            window.location.href = "student-dashboard.html";

        }


        // Submit course
        document.getElementById("courseForm").addEventListener("submit", function (event) {

            event.preventDefault();


            const courseName =
                document.getElementById("course_name").value;

            const description =
                document.getElementById("description").value;


            fetch("http://localhost:3000/create-course", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    course_name: courseName,

                    description: description,

                    instructor_id: user.user_id

                })

            })

                .then(response => response.json())

                .then(data => {

                    const message =
                        document.getElementById("course-message");


                    if (data.success) {

                        message.innerText =
                            "Course created successfully!";

                        document.getElementById("courseForm").reset();

                    } else {

                        message.innerText =
                            data.message;

                    }

                })

                .catch(error => {

                    console.log(error);

                    document.getElementById("course-message").innerText =
                        "Unable to create course.";

                });

        });

    </script>
    <script src="logout.js"></script>
</body>

</html>
